openapi: 3.2.0
info:
  title: looot Monid Trace API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Monid Trace
paths:
  /v1/monid-trace:
    get:
      summary: 'Reviewer-facing trace of every Monid-derived story: public source, looot…'
      responses:
        '200':
          description: The verified trace joined with the story ledger
        '403':
          description: local-product:read scope required
        '503':
          description: The trace failed its own verify-beyond-treg honesty checks and is refused
      tags:
      - Monid Trace
      operationId: getV1MonidTrace
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
