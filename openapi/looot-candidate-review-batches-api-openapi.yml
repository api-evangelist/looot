openapi: 3.2.0
info:
  title: looot Candidate Review Batches API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Candidate Review Batches
paths:
  /v1/candidate-review-batches:
    post:
      summary: Move explicitly selected ready diff candidates from unreviewed to reviewing only
      responses:
        '200':
          description: Per-item CAS outcomes; no acceptance
        '400':
          description: Invalid or mismatched source versions
        '403':
          description: candidates:write scope required
        '404':
          description: Source version not found
      tags:
      - Candidate Review Batches
      operationId: postV1CandidateReviewBatches
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
