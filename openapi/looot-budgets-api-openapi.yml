openapi: 3.2.0
info:
  title: looot Budgets API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Budgets
paths:
  /v1/budgets:
    get:
      summary: List budgets
      responses:
        '200':
          description: Success
      tags:
      - Budgets
      operationId: getV1Budgets
      x-operation-id-source: derived
    post:
      summary: Create a budget draft
      responses:
        '200':
          description: Success
      tags:
      - Budgets
      operationId: postV1Budgets
      x-operation-id-source: derived
  /v1/budgets/{budgetId}:
    get:
      summary: Get a budget
      responses:
        '200':
          description: Success
      tags:
      - Budgets
      operationId: getV1BudgetsByBudgetId
      x-operation-id-source: derived
  /v1/budgets/{budgetId}/revisions:
    post:
      summary: Revise a budget draft
      responses:
        '200':
          description: Success
      tags:
      - Budgets
      operationId: postV1BudgetsByBudgetIdRevisions
      x-operation-id-source: derived
  /v1/budgets/{budgetId}/publish:
    post:
      summary: Publish a budget version
      responses:
        '200':
          description: Success
      tags:
      - Budgets
      operationId: postV1BudgetsByBudgetIdPublish
      x-operation-id-source: derived
  /v1/budgets/preview:
    post:
      summary: Preview budget consumption without committing it
      responses:
        '200':
          description: Success
      tags:
      - Budgets
      operationId: postV1BudgetsPreview
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
