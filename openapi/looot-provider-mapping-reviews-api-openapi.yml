openapi: 3.2.0
info:
  title: looot Provider Mapping Reviews API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Provider Mapping Reviews
paths:
  /v1/provider-mapping-reviews/{packageId}:
    get:
      summary: Get current mapping revision and independent review status
      responses:
        '200':
          description: Review snapshot; activationReady is always false
        '403':
          description: provider-packages:read scope required
      tags:
      - Provider Mapping Reviews
      operationId: getV1ProviderMappingReviewsByPackageId
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
