openapi: 3.2.0
info:
  title: looot Compatibility Gate Submissions API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Compatibility Gate Submissions
paths:
  /v1/compatibility-gate-submissions/{submissionId}/decision:
    post:
      summary: Independently approve or reject one immutable gate submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideCompatibilityGate'
      responses:
        '200':
          description: Idempotent replay
        '201':
          description: Immutable decision created
        '400':
          description: Self-review or unresolved production prerequisites
        '403':
          description: compatibility:review scope required
        '404':
          description: Submission not found
        '409':
          description: Conflicting prior decision
      tags:
      - Compatibility Gate Submissions
      operationId: postV1CompatibilityGateSubmissionsBySubmissionIdDecision
      x-operation-id-source: derived
components:
  schemas:
    DecideCompatibilityGate:
      type: object
      additionalProperties: false
      required:
      - decision
      - reason
      properties:
        decision:
          enum:
          - approved
          - rejected
        reason:
          type: string
          minLength: 1
          maxLength: 2000
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
