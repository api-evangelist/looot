openapi: 3.2.0
info:
  title: looot Candidate Sources API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Candidate Sources
paths:
  /v1/candidate-sources:
    get:
      summary: List stable bounded summaries of every quarantined OpenAPI or metadata source…
      parameters:
      - name: sourceRef
        in: query
        schema:
          type: string
      - name: providerId
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          pattern: ^css_[a-f0-9]{32}$
          maxLength: 36
      responses:
        '200':
          description: Digest, version, operation, review and unsupported-feature summaries
        '400':
          description: Invalid filter, limit, or stale cursor
        '403':
          description: candidates:read scope required
      tags:
      - Candidate Sources
      operationId: getV1CandidateSources
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
