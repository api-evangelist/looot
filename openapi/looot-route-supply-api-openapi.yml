openapi: 3.2.0
info:
  title: looot Route Supply API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Route Supply
paths:
  /v1/route-supply:
    get:
      summary: List fixture route supply and catalog-only imported or reviewed provider…
      responses:
        '200':
          description: Derived non-mutating supply inventory
        '403':
          description: routes:read scope required
      tags:
      - Route Supply
      operationId: getV1RouteSupply
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
