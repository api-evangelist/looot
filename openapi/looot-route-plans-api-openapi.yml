openapi: 3.2.0
info:
  title: looot Route Plans API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Route Plans
paths:
  /v1/route-plans/preview:
    post:
      summary: Preview a route decision plan against the published route policy
      responses:
        '200':
          description: Success
      tags:
      - Route Plans
      operationId: postV1RoutePlansPreview
      x-operation-id-source: derived
  /v1/route-plans/shadow:
    post:
      summary: Shadow-evaluate a route decision plan without committing it
      responses:
        '200':
          description: Success
      tags:
      - Route Plans
      operationId: postV1RoutePlansShadow
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
