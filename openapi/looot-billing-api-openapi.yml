openapi: 3.2.0
info:
  title: looot Billing API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Billing
paths:
  /v1/billing/stripe/webhook:
    post:
      summary: Stripe webhook (signature-verified, no bearer token)
      responses:
        '200':
          description: Success
      tags:
      - Billing
      operationId: postV1BillingStripeWebhook
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
