openapi: 3.2.0
info:
  title: looot Provider Onboarding Queue API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Provider Onboarding Queue
paths:
  /v1/provider-onboarding-queue:
    get:
      summary: List stable, stage-filtered pages of exact next onboarding actions
      parameters:
      - name: stage
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 300
      responses:
        '200':
          description: Derived non-mutating page with global stage counts
        '400':
          description: Invalid stage, limit, or stale cursor
        '403':
          description: candidates:read scope required
      tags:
      - Provider Onboarding Queue
      operationId: getV1ProviderOnboardingQueue
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
