openapi: 3.2.0
info:
  title: looot Workflow Callbacks API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Workflow Callbacks
paths:
  /v1/workflow-callbacks/{token}:
    post:
      security: []
      summary: Resolve an external callback using a signed capability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveWorkflowCallback'
      responses:
        '200':
          description: Resolved wait
        '401':
          description: Invalid capability token
        '409':
          description: Wait already resolved
        '410':
          description: Capability expired
      tags:
      - Workflow Callbacks
      operationId: postV1WorkflowCallbacksByToken
      x-operation-id-source: derived
components:
  schemas:
    ResolveWorkflowCallback:
      type: object
      additionalProperties: false
      required:
      - payload
      properties:
        payload: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
