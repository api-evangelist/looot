openapi: 3.2.0
info:
  title: looot Cli Runs API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Cli Runs
paths:
  /v1/cli-runs:
    get:
      summary: List CLI runs
      responses:
        '200':
          description: Success
      tags:
      - Cli Runs
      operationId: getV1CliRuns
      x-operation-id-source: derived
    post:
      summary: Start a CLI run; argv[0] must resolve to an allowlisted binary digest…
      responses:
        '201':
          description: Created (queued, denied, or already completed synchronously)
      tags:
      - Cli Runs
      operationId: postV1CliRuns
      x-operation-id-source: derived
  /v1/cli-runs/{cliRunId}:
    get:
      summary: Get a CLI run's status, exit code and artifact ids
      responses:
        '200':
          description: Success
      tags:
      - Cli Runs
      operationId: getV1CliRunsByCliRunId
      x-operation-id-source: derived
  /v1/cli-runs/{cliRunId}/artifacts/stdout:
    get:
      summary: Download a CLI run's captured stdout
      responses:
        '200':
          description: Binary content
        '404':
          description: Not found
      tags:
      - Cli Runs
      operationId: getV1CliRunsByCliRunIdArtifactsStdout
      x-operation-id-source: derived
  /v1/cli-runs/{cliRunId}/artifacts/stderr:
    get:
      summary: Download a CLI run's captured stderr
      responses:
        '200':
          description: Binary content
        '404':
          description: Not found
      tags:
      - Cli Runs
      operationId: getV1CliRunsByCliRunIdArtifactsStderr
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
