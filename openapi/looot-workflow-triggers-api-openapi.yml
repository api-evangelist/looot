openapi: 3.2.0
info:
  title: looot Workflow Triggers API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Workflow Triggers
paths:
  /v1/workflow-triggers:
    get:
      summary: List tenant workflow triggers
      responses:
        '200':
          description: Success
      tags:
      - Workflow Triggers
      operationId: getV1WorkflowTriggers
      x-operation-id-source: derived
    post:
      summary: Create a schedule, event, or webhook trigger
      responses:
        '200':
          description: Success
      tags:
      - Workflow Triggers
      operationId: postV1WorkflowTriggers
      x-operation-id-source: derived
  /v1/workflow-triggers/{triggerId}/status:
    post:
      summary: Pause, resume, or revoke a workflow trigger
      responses:
        '200':
          description: Success
      tags:
      - Workflow Triggers
      operationId: postV1WorkflowTriggersByTriggerIdStatus
      x-operation-id-source: derived
  /v1/workflow-triggers/{triggerId}/deliver:
    post:
      summary: Accept an idempotent trigger delivery
      responses:
        '200':
          description: Success
      tags:
      - Workflow Triggers
      operationId: postV1WorkflowTriggersByTriggerIdDeliver
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
