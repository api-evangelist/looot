openapi: 3.2.0
info:
  title: looot Email API
  version: 0.1.0
  description: Discover, inspect, run, and pay for real (or fixture) provider operations through one bearer token.
servers:
- url: https://api.looot.ai
  description: Public API (default)
- url: https://coset-gateway.onrender.com
  description: Legacy host -- still live, for tokens issued before the public domain existed
- url: http://127.0.0.1:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: Email
paths:
  /v1/email/resend/webhook:
    post:
      summary: Resend delivery-event webhook (signature-verified, no bearer token)
      responses:
        '200':
          description: Success
      tags:
      - Email
      operationId: postV1EmailResendWebhook
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
