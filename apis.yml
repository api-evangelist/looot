aid: looot
name: looot
image: https://looot.ai/opengraph-image
description: looot provides a unified API marketplace that gives agents a single key and prepaid balance to access over 2,350 endpoints from 76
  data providers. It offers a platform API (OpenAPI 3.1 with 261 paths) including a public catalog, and an MCP for bearer‑authenticated access.
  The service integrates with major AI assistants like Claude, Cursor, Codex, and ChatGPT, enabling tasks such as LinkedIn profile lookup, email
  discovery, SEO ranking, and social media trend analysis. Pricing is usage‑based, and documentation is available at docs.looot.ai.
